# Mantiene activo el proyecto de Supabase (plan gratis) haciendo una consulta liviana cada 3 días,
# para que no se pause por inactividad.
# Ubicación en el repositorio: .github/workflows/keepalive-supabase.yml
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 12 */3 * *'   # cada 3 días, a las 12:17 UTC
  workflow_dispatch:           # también se puede correr a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta liviana a la base
        run: |
          curl -fsS "https://rztbzxuoncqevmhllmsr.supabase.co/rest/v1/categorias?select=id&limit=1" \
            -H "apikey: sb_publishable_nQGfFH12TVtJjfxi0EURaw_T87CNAlh"
