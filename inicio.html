<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Economía</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E0621F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Economía">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4EE; --panel:#FFFFFF; --ink:#271D14; --ink-soft:#8A7C6C; --line:#EAE2D3;
    --accent:#E0621F; --accent-dark:#B84B14; --accent-tint:#FCE4D3;
    --egreso:#A23B2E; --egreso-tint:#F4DCD6;
    --shadow:0 2px 14px rgba(90,60,30,.07);
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap{ width:100%; max-width:640px; }
  .brand{ text-align:center; margin-bottom:36px; }
  .brand .mark{ width:52px; height:52px; border-radius:50%; background:var(--accent); color:#fff;
    display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 14px; font-weight:700; }
  .brand h1{ font-family:'Fraunces',serif; font-size:22px; margin:0 0 4px; font-weight:600; }
  .brand p{ margin:0; color:var(--ink-soft); font-size:13.5px; }
  .cards{ display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media(max-width:560px){ .cards{ grid-template-columns:1fr; } }
  .card{ background:var(--panel); border-radius:18px; padding:30px 24px; box-shadow:var(--shadow); cursor:pointer;
    text-align:left; position:relative; transition:transform .15s ease; border:1px solid transparent; }
  .card:hover{ transform:translateY(-3px); border-color:var(--accent-tint); }
  .card .icon{ width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; margin-bottom:16px; }
  .card.economia .icon{ background:var(--accent-tint); }
  .card.cuotas .icon{ background:var(--egreso-tint); }
  .card h2{ font-family:'Fraunces',serif; font-size:18px; margin:0 0 6px; font-weight:600; }
  .card p{ margin:0; color:var(--ink-soft); font-size:13px; line-height:1.5; }
  .badge{ position:absolute; top:20px; right:20px; background:var(--egreso); color:#fff; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:999px; display:none; }
  .badge.show{ display:inline-block; }
  .logout{ display:block; text-align:center; margin:28px auto 0; all:unset; cursor:pointer; font-size:12.5px;
    color:var(--ink-soft); padding:8px 14px; border-radius:999px; }
  .logout:hover{ background:var(--line); color:var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <div class="mark">$</div>
    <h1 id="saludo">Hola</h1>
    <p>¿Qué querés ver hoy?</p>
  </div>
  <div class="cards">
    <div class="card economia" onclick="window.location.href='app.html'">
      <div class="icon">📊</div>
      <h2>Economía</h2>
      <p>Tus ingresos y egresos, ahorros e inversiones.</p>
    </div>
    <div class="card cuotas" onclick="window.location.href='cuotas.html'">
      <div class="icon">💳</div>
      <h2>Cuotas</h2>
      <p>Compras en cuotas y quién le debe a quién.</p>
      <span class="badge" id="badgeCuotas">0</span>
    </div>
  </div>
  <button class="logout" onclick="logout()">Cerrar sesión</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://rztbzxuoncqevmhllmsr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nQGfFH12TVtJjfxi0EURaw_T87CNAlh';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function logout(){ await sb.auth.signOut(); window.location.href='index.html'; }

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.href='index.html'; return; }

  const { data: profile } = await sb.from('profiles').select('*').eq('id', session.user.id).maybeSingle();
  document.getElementById('saludo').textContent = 'Hola' + (profile?.nombre ? ', ' + profile.nombre : '');

  // Campanita: cuántas cuotas activas te corresponden a vos (sos el dueño) en una tarjeta que no es tuya
  try{
    const { data: personas } = await sb.from('personas').select('*');
    const miPersona = personas?.find(p => p.user_id === session.user.id);
    if(miPersona){
      const { data: tarjetas } = await sb.from('tarjetas').select('*');
      const { data: compras } = await sb.from('compras').select('*').eq('dueno_persona_id', miPersona.id);
      const hoy = new Date();
      let activas = 0;
      (compras||[]).forEach(c=>{
        const t = tarjetas.find(x=>x.id===c.tarjeta_id);
        if(!t || t.titular_persona_id === miPersona.id) return; // es tuya, no hay deuda
        const fc = new Date(c.fecha_compra);
        const mesesPasados = (hoy.getFullYear()-fc.getFullYear())*12 + (hoy.getMonth()-fc.getMonth());
        if(mesesPasados >= 0 && mesesPasados < c.cuotas_totales) activas++;
      });
      if(activas > 0){
        const b = document.getElementById('badgeCuotas');
        b.textContent = activas;
        b.classList.add('show');
      }
    }
  }catch(e){ console.error('No se pudo calcular la campanita:', e); }
}
boot();
</script>
</body>
</html>
