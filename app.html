<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Economía</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#E0621F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Economía">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F4EE; --panel:#FFFFFF; --ink:#271D14; --ink-soft:#8A7C6C; --line:#EAE2D3;
    --accent:#E0621F; --accent-dark:#B84B14; --accent-tint:#FCE4D3;
    --ingreso:#2F7D5E; --ingreso-tint:#DFEFE7;
    --egreso:#A23B2E; --egreso-tint:#F4DCD6;
    --amber:#B9821F; --amber-tint:#F5E7C8;
    --blue:#2E5C8A; --blue-tint:#DEE8F1;
    --gray:#6E6153; --gray-tint:#EFEAE1;
    --shadow:0 2px 14px rgba(90,60,30,.07);
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; font-size:14px; line-height:1.5; }
  h1,h2,h3,.brand{ font-family:'Fraunces',serif; font-weight:600; letter-spacing:-0.01em; }

  .topnav{ position:sticky; top:0; z-index:60; display:flex; align-items:center;
    padding:14px 32px; background:rgba(247,244,238,.92); backdrop-filter:blur(6px); border-bottom:1px solid var(--line); gap:24px; flex-wrap:wrap; }
  .brand{ font-size:18px; display:flex; align-items:center; gap:9px; color:var(--ink); white-space:nowrap; order:1; }
  .brand .mark{ width:26px; height:26px; border-radius:50%; background:var(--accent); color:#fff; display:flex; align-items:center;
    justify-content:center; font-size:13px; font-family:'Inter'; font-weight:700; flex-shrink:0; }
  .nav{ display:flex; gap:4px; flex-wrap:wrap; order:2; flex:1 1 auto; min-width:0; }
  .nav button{ all:unset; cursor:pointer; padding:7px 3px; margin-right:18px; font-size:13.5px; color:var(--ink-soft); font-weight:500;
    border-bottom:2px solid transparent; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .nav button:hover{ color:var(--ink); }
  .nav button.active{ color:var(--accent-dark); border-bottom-color:var(--accent); font-weight:600; }
  .topnav-right{ display:flex; align-items:center; gap:14px; order:3; margin-left:auto; }
  .navlink{ all:unset; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--ink-soft); border:1px solid var(--line);
    background:#fff; padding:8px 14px; border-radius:999px; }
  .navlink:hover{ background:var(--gray-tint); }
  .userchip{ font-size:12.5px; color:var(--ink-soft); text-align:right; line-height:1.3; cursor:pointer; }
  .userchip b{ color:var(--ink); display:block; font-size:13px; }
  .userchip:hover b{ text-decoration:underline; }
  .btn-salir{ all:unset; cursor:pointer; font-size:12.5px; font-weight:600; color:var(--egreso); border:1px solid var(--egreso-tint);
    background:var(--egreso-tint); padding:8px 15px; border-radius:999px; }
  .btn-salir:hover{ background:#EAC8C1; }

  .main{ flex:1 1 auto; min-width:0; padding:30px 40px 60px; width:100%; max-width:1500px; margin:0 auto; }
  .pagehead{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; flex-wrap:wrap; gap:12px; }
  .pagehead h1{ font-size:23px; margin:0 0 4px; }
  .pagehead p{ margin:0; color:var(--ink-soft); font-size:13px; }
  .filters{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .filters select{ padding:8px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:13px; color:var(--ink); font-family:'Inter'; }

  button.primary{ all:unset; cursor:pointer; background:var(--accent); color:#fff; padding:10px 18px; border-radius:999px; font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:6px; }
  button.primary:hover{ background:var(--accent-dark); }
  button.egreso{ background:var(--egreso); }
  button.egreso:hover{ background:#7E2F24; }
  button.ghost{ all:unset; cursor:pointer; padding:8px 14px; border-radius:999px; font-size:12.5px; color:var(--ink-soft); border:1px solid var(--line); background:#fff; }
  button.ghost:hover{ background:var(--accent-tint); color:var(--ink); }

  .card{ background:var(--panel); border-radius:14px; overflow:hidden; box-shadow:var(--shadow); }
  .grid4{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:22px; }
  @media(max-width:900px){ .grid4{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  .grid2{ display:grid; grid-template-columns:1.3fr 1fr; gap:18px; align-items:start; }
  @media(max-width:1100px){ .grid2{ grid-template-columns:1fr; } }

  /* Hero de Resumen */
  .hero{ display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:20px; padding:8px 4px 30px; border-bottom:1px solid var(--line); margin-bottom:26px; }
  .hero .lbl{ font-size:13px; color:var(--ink-soft); margin-bottom:6px; }
  .hero .num{ font-family:'Fraunces',serif; font-size:52px; font-weight:600; line-height:1; letter-spacing:-0.02em; }
  .hero .num.neg{ color:var(--egreso); } .hero .num.pos{ color:var(--ink); }
  .hero-sub{ display:flex; gap:26px; }
  .hero-sub div{ font-size:12.5px; color:var(--ink-soft); }
  .hero-sub b{ display:block; font-size:16px; font-family:'Fraunces',serif; font-weight:600; margin-top:2px; }
  .hero-sub b.ing{ color:var(--ingreso); } .hero-sub b.egr{ color:var(--egreso); }

  .pillrow{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:26px; }
  .pill-acc{ flex:1; min-width:160px; background:var(--panel); border-radius:999px; padding:12px 20px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:2px; }
  .pill-acc .lbl{ font-size:11.5px; color:var(--ink-soft); }
  .pill-acc .val{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; }
  .pill-acc.pos .val{ color:var(--ingreso); } .pill-acc.neg .val{ color:var(--egreso); }

  .stat{ background:var(--panel); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow); }
  .stat .lbl{ font-size:12px; color:var(--ink-soft); margin-bottom:8px; display:flex; align-items:center; gap:6px; }
  .stat .val{ font-family:'Fraunces',serif; font-size:20px; font-weight:600; }
  .stat .sub{ font-size:11.5px; margin-top:6px; display:flex; justify-content:space-between; color:var(--ink-soft); }
  .stat .sub b.pos{ color:var(--ingreso); } .stat .sub b.neg{ color:var(--egreso); }
  .stat.bal-pos .val{ color:var(--ingreso); } .stat.bal-neg .val{ color:var(--egreso); }

  table{ width:100%; border-collapse:collapse; }
  th{ text-align:left; font-size:11px; color:var(--ink-soft); font-weight:600; letter-spacing:.02em; padding:12px 18px; border-bottom:2px solid var(--ink); }
  td{ padding:12px 18px; border-bottom:1px solid var(--line); font-size:13.5px; vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#FBF4EC; }
  td.num{ text-align:right; font-variant-numeric:tabular-nums; }
  .tag{ display:inline-flex; align-items:center; gap:5px; padding:3px 11px; border-radius:999px; font-size:12px; font-weight:500; }
  .tag-ingreso{ background:var(--ingreso-tint); color:#194028; }
  .tag-egreso{ background:var(--egreso-tint); color:#5B2E24; }
  .actions button{ all:unset; cursor:pointer; color:var(--ink-soft); font-size:12px; margin-left:10px; }
  .actions button:hover{ color:var(--ink); text-decoration:underline; }
  .empty{ padding:46px 16px; text-align:center; color:var(--ink-soft); }
  .empty b{ display:block; color:var(--ink); font-size:15px; margin-bottom:5px; font-family:'Fraunces',serif; }

  .tabs{ display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tabs button{ all:unset; cursor:pointer; padding:8px 16px; border-radius:999px; font-size:13px; font-weight:500; color:var(--ink-soft); border:1px solid var(--line); background:#fff; }
  .tabs button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:10px; }

  /* charts (css-only bars) */
  .chart-card{ padding:20px 22px 16px; }
  .chart-card h3{ font-size:15px; margin:0 0 16px; font-weight:600; }
  .bars{ display:flex; align-items:flex-end; gap:10px; height:150px; padding:0 2px; }
  .bar-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:4px; }
  .bar-pair{ display:flex; align-items:flex-end; gap:3px; height:100%; width:100%; justify-content:center; }
  .bar{ width:11px; border-radius:3px 3px 0 0; min-height:2px; }
  .bar.ing{ background:var(--ingreso); } .bar.egr{ background:var(--egreso); }
  .bar-col .lbl{ font-size:10.5px; color:var(--ink-soft); margin-top:2px; }
  .legend{ display:flex; gap:16px; font-size:12px; color:var(--ink-soft); margin-bottom:2px; }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .dot{ width:8px; height:8px; border-radius:2px; display:inline-block; }
  .hbars{ display:flex; flex-direction:column; gap:10px; }
  .hbar-row{ display:grid; grid-template-columns:150px 1fr 90px; align-items:center; gap:10px; font-size:12.5px; }
  .hbar-track{ background:var(--gray-tint); border-radius:5px; height:9px; overflow:hidden; }
  .hbar-fill{ height:100%; border-radius:5px; background:var(--egreso); }
  .hbar-row .amt{ text-align:right; font-variant-numeric:tabular-nums; color:var(--ink-soft); }

  /* Modal */
  .overlay{ position:fixed; inset:0; background:rgba(30,20,10,.4); display:none; align-items:flex-start; justify-content:center; padding-top:6vh; z-index:100; backdrop-filter:blur(2px); }
  .overlay.show{ display:flex; }
  .modal{ background:#fff; border-radius:18px; width:440px; max-width:92vw; padding:26px; box-shadow:0 24px 48px rgba(40,25,10,.18); max-height:88vh; overflow:auto; }
  .modal h3{ margin:0 0 16px; font-size:18px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:500; color:var(--ink-soft); margin-bottom:5px; }
  .money-input{ position:relative; }
  .money-input .prefix{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--ink-soft); font-size:13.5px; pointer-events:none; }
  .money-input input{ padding-left:30px !important; }
  .field input, .field select, .field textarea{ width:100%; padding:9px 12px; border-radius:10px; border:1px solid var(--line); font-family:'Inter'; font-size:13.5px; background:#fff; color:var(--ink); }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:20px; }
  .err{ color:var(--egreso); font-size:12px; margin-top:6px; display:none; font-weight:500; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; margin-bottom:14px; }
  .seg button{ all:unset; cursor:pointer; flex:1; text-align:center; padding:9px; font-size:13px; font-weight:600; color:var(--ink-soft); }
  .seg button.on-ingreso.active{ background:var(--ingreso-tint); color:#194028; }
  .seg button.on-egreso.active{ background:var(--egreso-tint); color:#5B2E24; }

  .cat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:18px; }
  @media(max-width:800px){ .cat-grid{ grid-template-columns:1fr; } }
  .cat-item{ display:flex; align-items:center; justify-content:space-between; padding:10px 16px; border-bottom:1px solid var(--line); font-size:13.5px; }
  .cat-item:last-child{ border-bottom:none; }
  .cat-item.inactiva{ opacity:.45; }
  .cat-item .name{ display:flex; align-items:center; gap:8px; }

  .toast{ position:fixed; bottom:20px; right:20px; background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:13px; box-shadow:0 8px 20px rgba(0,0,0,.2); opacity:0; transform:translateY(8px); transition:.2s; pointer-events:none; z-index:200; }
  .toast.show{ opacity:1; transform:translateY(0); }

  .hint-box{ background:var(--accent-tint); color:#7A3A12; border-radius:14px; padding:16px 18px; font-size:12.5px; line-height:1.6; margin-bottom:18px; }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

  @media(max-width:760px){
    .topnav{ padding:10px 14px; gap:8px 10px; }
    .brand{ font-size:16px; order:1; }
    .nav{ order:3; flex:1 1 100%; width:100%; overflow-x:auto; flex-wrap:nowrap; gap:2px; padding-bottom:2px; }
    .nav button{ margin-right:14px; white-space:nowrap; font-size:13px; }
    .topnav-right{ order:2; margin-left:auto; gap:6px; }
    .navlink{ padding:6px 9px; }
    .navlink .lbl{ display:none; }
    .userchip{ font-size:11.5px; }
    .userchip span{ display:none; }
    .btn-salir{ padding:7px 12px; font-size:12px; }
    .main{ padding:16px 14px 50px; max-width:100%; }
    .pagehead{ gap:10px; }
    .pagehead h1{ font-size:19px; }
    .filters{ width:100%; }
    .filters select{ flex:1; min-width:0; }
    .hero{ padding:4px 2px 22px; gap:14px; }
    .hero .num{ font-size:34px; }
    .hero-sub{ gap:16px; }
    .grid4{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .pillrow{ gap:8px; }
    .pill-acc{ min-width:0; flex:1 1 45%; padding:10px 14px; }
    .tabs{ overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px; }
    .tabs button{ white-space:nowrap; }
    table{ min-width:560px; }
    th,td{ padding:10px 12px; }
    .modal{ padding:20px; border-radius:16px; }
    .row2{ grid-template-columns:1fr; }
    .toolbar{ flex-direction:column; align-items:stretch; }
    .toolbar > div{ width:100%; }
    .toolbar button.primary{ flex:1; justify-content:center; }
  }
</style>
</head>
<body>

<div class="topnav">
  <div class="brand"><span class="mark">$</span> Mi Economía</div>
  <div class="nav" id="nav">
    <button data-view="resumen" onclick="setView('resumen')">Resumen</button>
    <button data-view="movimientos" onclick="setView('movimientos')">Movimientos</button>
    <button data-view="estadisticas" onclick="setView('estadisticas')">Estadísticas</button>
    <button data-view="categorias" onclick="setView('categorias')" id="navCategorias" style="display:none;">Categorías</button>
    <button data-view="usuarios" onclick="setView('usuarios')" id="navUsuarios" style="display:none;">Usuarios</button>
  </div>
  <div class="topnav-right">
    <a class="navlink" href="cuotas.html">💳<span class="lbl"> Cuotas</span></a>
    <a class="navlink" href="inicio.html">🏠<span class="lbl"> Inicio</span></a>
    <div class="userchip" onclick="editarNombre()" title="Tocá para editar tu nombre"><b id="userNombre">—</b><span id="userRol"></span></div>
    <button class="btn-salir" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="main">
  <div class="pagehead">
    <div>
      <h1 id="viewTitle">Resumen</h1>
      <p id="viewSub"></p>
    </div>
    <div class="filters" id="filtersBar"></div>
  </div>
  <div id="content"></div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modalBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
// ============================================================
// CONFIGURACIÓN: mismos valores que pusiste en index.html
// ============================================================
const SUPABASE_URL = 'https://rztbzxuoncqevmhllmsr.supabase.co';
const SUPABASE_KEY = 'sb_publishable_nQGfFH12TVtJjfxi0EURaw_T87CNAlh';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CUENTAS = {
  diario:    { label:'Diario',    color:'var(--ingreso)' },
  dolar:     { label:'Dólar',     color:'var(--blue)' },
  ahorros:   { label:'Ahorros',   color:'var(--amber)' },
  inversion: { label:'Inversión', color:'var(--gray)' }
};
const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

let state = {
  user:null, profile:null, categorias:[], movimientos:[],
  view:'resumen', movCuenta:'diario',
  year: new Date().getFullYear(), month: new Date().getMonth()+1 // mes actual por defecto
};

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ window.location.href='index.html'; return; }
  state.user = session.user;
  await load();
  render();
}

async function load(){
  const [profRes, catRes, movRes] = await Promise.allSettled([
    sb.from('profiles').select('*').eq('id', state.user.id).maybeSingle(),
    sb.from('categorias').select('*').order('tipo').order('orden'),
    sb.from('movimientos').select('*').eq('user_id', state.user.id).order('fecha', { ascending:false })
  ]);

  const profData = profRes.status==='fulfilled' ? profRes.value : null;
  const catData = catRes.status==='fulfilled' ? catRes.value : null;
  const movData = movRes.status==='fulfilled' ? movRes.value : null;

  state.profile = profData?.data || null;
  state.categorias = catData?.data || [];
  state.movimientos = movData?.data || [];

  const errores = [profData?.error, catData?.error, movData?.error].filter(Boolean);
  if(errores.length){
    console.error('Errores al cargar datos:', errores);
    toast('Hubo un problema cargando algunos datos. Mirá la consola para más detalle.');
  }

  document.getElementById('userNombre').textContent = state.profile?.nombre || state.user.email;
  document.getElementById('userRol').textContent = state.profile?.rol === 'admin' ? 'Administrador' : 'Usuario';
  const isAdmin = state.profile?.rol === 'admin';
  document.getElementById('navCategorias').style.display = isAdmin ? '' : 'none';
  document.getElementById('navUsuarios').style.display = isAdmin ? '' : 'none';

  if(isAdmin){
    const { data: allProfiles, error: errAll } = await sb.from('profiles').select('*').order('created_at');
    if(errAll) console.error('Error cargando usuarios:', errAll);
    state.allProfiles = allProfiles || [];
  }
}

function editarNombre(){
  const actual = state.profile?.nombre || '';
  openModal(`
    <h3>Tu nombre</h3>
    <div class="field">
      <label>¿Cómo querés que te llamemos en la app?</label>
      <input type="text" id="nNombre" value="${esc(actual)}" placeholder="Ej: Juan">
    </div>
    <div class="err" id="nErr"></div>
    <div class="modal-actions">
      <span></span>
      <div style="display:flex;gap:8px;">
        <button class="ghost" onclick="closeModal()">Cancelar</button>
        <button class="primary" onclick="guardarNombre()">Guardar</button>
      </div>
    </div>
  `);
  setTimeout(()=>document.getElementById('nNombre')?.focus(), 50);
}
async function guardarNombre(){
  const limpio = document.getElementById('nNombre').value.trim();
  if(!limpio){
    const e = document.getElementById('nErr'); e.textContent='Escribí un nombre.'; e.style.display='block';
    return;
  }
  const { error } = await sb.from('profiles').update({ nombre: limpio }).eq('id', state.user.id);
  if(error){
    const e = document.getElementById('nErr'); e.textContent = 'No se pudo guardar: '+error.message; e.style.display='block';
    return;
  }
  closeModal();
  toast('Nombre actualizado');
  await load(); render();
}

async function logout(){ await sb.auth.signOut(); window.location.href='index.html'; }

function setView(v){
  state.view = v;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===v));
  render();
}

// ---------------- helpers ----------------
function esc(s){ return (s??'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function money(n, cuenta){ const signo = cuenta==='dolar' ? 'USD ' : '$'; return (n<0?'-':'') + signo + Math.abs(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// ---------- input de monto con formato $ 1.234,56 mientras se escribe ----------
function formatearInputMoneda(el){
  el.addEventListener('input', ()=>{
    let raw = el.value.replace(/[^\d,]/g,'');
    const partes = raw.split(',');
    let ent = partes[0].replace(/^0+(?=\d)/,'') || '0';
    let dec = partes.length>1 ? partes.slice(1).join('').slice(0,2) : undefined;
    const entFmt = ent.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    el.value = dec!==undefined ? entFmt+','+dec : entFmt;
  });
}
function valorMoneda(el){
  const raw = (el.value||'').replace(/\./g,'').replace(',', '.');
  return Number(raw)||0;
}
function setValorMoneda(el, n){
  el.value = n ? Number(n).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}) : '';
}
function fmtDate(d){ const [y,m,day] = d.split('-'); return `${day}/${m}/${y}`; }
function catById(id){ return state.categorias.find(c=>c.id===id); }
function catLabel(id){ const c = catById(id); return c ? `${c.icono||''} ${c.nombre}` : '—'; }

function movimientosFiltrados(cuenta){
  return state.movimientos.filter(m=>{
    if(cuenta && m.cuenta!==cuenta) return false;
    const [y,mo] = m.fecha.split('-').map(Number);
    if(state.year !== 0 && y !== state.year) return false;
    if(state.month !== 0 && mo !== state.month) return false;
    return true;
  });
}
function totales(lista){
  const ing = lista.filter(m=>m.tipo==='ingreso').reduce((a,m)=>a+Number(m.monto),0);
  const egr = lista.filter(m=>m.tipo==='egreso').reduce((a,m)=>a+Number(m.monto),0);
  return { ing, egr, bal: ing-egr };
}
function yearsDisponibles(){
  const ys = new Set(state.movimientos.map(m=>Number(m.fecha.split('-')[0])));
  ys.add(new Date().getFullYear());
  return Array.from(ys).sort((a,b)=>b-a);
}
function labelPeriodo(){
  const parteMes = state.month ? MESES[state.month-1] : 'Todo el año';
  const parteAnio = state.year===0 ? 'todos los años' : state.year;
  if(state.month && state.year===0) return `${parteMes}, todos los años`;
  if(state.month) return `${parteMes} ${parteAnio}`;
  return state.year===0 ? 'Todo el historial' : `${state.year}`;
}
function irAlMesActual(){
  state.month = new Date().getMonth()+1;
  state.year = new Date().getFullYear();
  render();
}
function irATodoElAnio(){
  state.month = 0;
  render();
}
function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

// ---------------- render dispatcher ----------------
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active', b.dataset.view===state.view));
  renderFiltersBar();
  const titles = {
    resumen:['Resumen','Cómo viene tu economía este período'],
    movimientos:['Movimientos','Cargá y revisá tus ingresos y egresos'],
    estadisticas:['Estadísticas','Tendencias y en qué se va la plata'],
    categorias:['Categorías','Las opciones que aparecen al cargar un movimiento'],
    usuarios:['Usuarios','Quién tiene acceso a la app']
  };
  document.getElementById('viewTitle').textContent = titles[state.view][0];
  document.getElementById('viewSub').textContent = titles[state.view][1];

  const c = document.getElementById('content');
  if(state.view==='resumen') c.innerHTML = renderResumen();
  else if(state.view==='movimientos') c.innerHTML = renderMovimientos();
  else if(state.view==='estadisticas') c.innerHTML = renderEstadisticas();
  else if(state.view==='categorias') c.innerHTML = renderCategorias();
  else if(state.view==='usuarios') c.innerHTML = renderUsuarios();
}

function renderFiltersBar(){
  const bar = document.getElementById('filtersBar');
  if(state.view==='categorias' || state.view==='usuarios'){ bar.innerHTML=''; return; }
  const years = yearsDisponibles();
  const esHoy = state.month===new Date().getMonth()+1 && state.year===new Date().getFullYear();
  bar.innerHTML = `
    <button class="ghost" style="${esHoy?'background:var(--accent-tint);color:var(--accent-dark);border-color:var(--accent-tint);':''}" onclick="irAlMesActual()">Actual</button>
    <button class="ghost" style="${state.month===0?'background:var(--accent-tint);color:var(--accent-dark);border-color:var(--accent-tint);':''}" onclick="irATodoElAnio()">Todo el año</button>
    <select onchange="state.month=Number(this.value); render();">
      <option value="0" ${state.month===0?'selected':''}>Todo el año</option>
      ${MESES.map((m,i)=>`<option value="${i+1}" ${state.month===i+1?'selected':''}>${m}</option>`).join('')}
    </select>
    <select onchange="state.year=Number(this.value); render();">
      <option value="0" ${state.year===0?'selected':''}>Todos</option>
      ${years.map(y=>`<option value="${y}" ${y===state.year?'selected':''}>${y}</option>`).join('')}
    </select>
  `;
}

// ---------------- RESUMEN ----------------
function renderResumen(){
  const totalGeneral = totales(movimientosFiltrados(null));
  const balClass = totalGeneral.bal>=0 ? 'pos' : 'neg';

  const pills = Object.keys(CUENTAS).map(cv=>{
    const t = totales(movimientosFiltrados(cv));
    const cls = t.bal>=0 ? 'pos' : 'neg';
    return `<div class="pill-acc ${cls}">
      <div class="lbl">${CUENTAS[cv].label}</div>
      <div class="val">${money(t.bal, cv)}</div>
    </div>`;
  }).join('');

  // barras mensuales cuenta Diario del período seleccionado
  const barsHtml = renderBarrasMensuales('diario');

  // top categorías de gasto (todas las cuentas, período filtrado)
  const gastos = movimientosFiltrados(null).filter(m=>m.tipo==='egreso');
  const porCat = {};
  gastos.forEach(m=>{ porCat[m.categoria_id] = (porCat[m.categoria_id]||0) + Number(m.monto); });
  const top = Object.entries(porCat).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const max = top.length ? top[0][1] : 1;
  const hbars = top.length ? top.map(([cid,val])=>`
    <div class="hbar-row">
      <div>${catLabel(Number(cid))}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(val/max*100).toFixed(1)}%"></div></div>
      <div class="amt">${money(val)}</div>
    </div>`).join('') : `<div class="empty">Todavía no cargaste egresos en este período.</div>`;

  return `
    <div class="hero">
      <div>
        <div class="lbl">Balance total · ${labelPeriodo()}</div>
        <div class="num ${balClass==='neg'?'neg':'pos'}">${money(totalGeneral.bal)}</div>
      </div>
      <div class="hero-sub">
        <div>Ingresos<b class="ing">${money(totalGeneral.ing)}</b></div>
        <div>Egresos<b class="egr">${money(totalGeneral.egr)}</b></div>
      </div>
    </div>
    <div class="pillrow">${pills}</div>
    <div class="grid2">
      <div class="card chart-card">
        <h3>Ingresos vs. Egresos — Diario · ${state.year===0?'todos los años':state.year}</h3>
        ${barsHtml}
      </div>
      <div class="card chart-card">
        <h3>Top categorías de gasto · ${labelPeriodo()}</h3>
        <div class="hbars">${hbars}</div>
      </div>
    </div>
  `;
}

function renderBarrasMensuales(cuenta){
  const datos = MESES.map((_,i)=>{
    const lista = state.movimientos.filter(m=>{
      const [y,mo] = m.fecha.split('-').map(Number);
      return m.cuenta===cuenta && (state.year===0 || y===state.year) && mo===i+1;
    });
    return totales(lista);
  });
  const max = Math.max(1, ...datos.map(d=>Math.max(d.ing,d.egr)));
  const cols = datos.map((d,i)=>`
    <div class="bar-col">
      <div class="bar-pair">
        <div class="bar ing" style="height:${(d.ing/max*100).toFixed(1)}%" title="Ingresos: ${money(d.ing, cuenta)}"></div>
        <div class="bar egr" style="height:${(d.egr/max*100).toFixed(1)}%" title="Egresos: ${money(d.egr, cuenta)}"></div>
      </div>
      <div class="lbl">${MESES[i].slice(0,3)}</div>
    </div>`).join('');
  return `<div class="legend"><span><i class="dot" style="background:var(--ingreso)"></i>Ingresos</span><span><i class="dot" style="background:var(--egreso)"></i>Egresos</span></div>
    <div class="bars">${cols}</div>`;
}

// ---------------- MOVIMIENTOS ----------------
function setMovCuenta(c){ state.movCuenta = c; render(); }

function renderMovimientos(){
  const tabs = Object.keys(CUENTAS).map(cv=>`<button class="${state.movCuenta===cv?'active':''}" onclick="setMovCuenta('${cv}')">${CUENTAS[cv].label}</button>`).join('');
  const lista = movimientosFiltrados(state.movCuenta).sort((a,b)=> b.fecha.localeCompare(a.fecha));
  const t = totales(lista);

  const rows = lista.map(m=>`
    <tr>
      <td>${fmtDate(m.fecha)}</td>
      <td><span class="tag tag-${m.tipo}">${catLabel(m.categoria_id)}</span></td>
      <td>${esc(m.detalle||'')}</td>
      <td class="num" style="color:${m.tipo==='ingreso'?'var(--ingreso)':'var(--egreso)'}">${m.tipo==='ingreso'?'+':'-'}${money(m.monto, m.cuenta)}</td>
      <td class="actions">
        <button onclick="editMovimiento(${m.id})">Editar</button>
        <button onclick="delMovimiento(${m.id})">Eliminar</button>
      </td>
    </tr>`).join('');

  return `
    <div class="tabs">${tabs}</div>
    <div class="grid4" style="grid-template-columns:repeat(3,1fr);">
      <div class="stat"><div class="lbl">Ingresos</div><div class="val" style="color:var(--ingreso)">${money(t.ing, state.movCuenta)}</div></div>
      <div class="stat"><div class="lbl">Egresos</div><div class="val" style="color:var(--egreso)">${money(t.egr, state.movCuenta)}</div></div>
      <div class="stat ${t.bal>=0?'bal-pos':'bal-neg'}"><div class="lbl">Balance</div><div class="val">${money(t.bal, state.movCuenta)}</div></div>
    </div>
    <div class="toolbar">
      <div style="font-size:13px;color:var(--ink-soft)">${lista.length} movimiento(s)</div>
      <div style="display:flex;gap:8px;">
        <button class="primary" onclick="movimientoForm('ingreso')">+ Ingreso</button>
        <button class="primary egreso" onclick="movimientoForm('egreso')">+ Egreso</button>
      </div>
    </div>
    <div class="card">
      ${lista.length ? `<div class="table-scroll"><table><thead><tr><th>Fecha</th><th>Categoría</th><th>Detalle</th><th style="text-align:right">Monto</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`
        : `<div class="empty"><b>Sin movimientos</b>Agregá un ingreso o egreso para esta cuenta y período.</div>`}
    </div>
  `;
}

function movimientoForm(tipo, existing){
  const cats = state.categorias.filter(c=>c.tipo===tipo && (c.activa!==false || (existing && existing.categoria_id===c.id)));
  const isEdit = !!existing;
  const fecha = existing?.fecha || new Date().toISOString().slice(0,10);
  openModal(`
    <h3>${isEdit? 'Editar':'Nuevo'} ${tipo==='ingreso'?'ingreso':'egreso'}</h3>
    <div class="field">
      <label>Cuenta</label>
      <select id="mCuenta" onchange="document.getElementById('mMontoPrefix').textContent = this.value==='dolar' ? 'USD' : '$';">
        ${Object.keys(CUENTAS).map(cv=>`<option value="${cv}" ${ (existing?.cuenta||state.movCuenta)===cv?'selected':''}>${CUENTAS[cv].label}</option>`).join('')}
      </select>
    </div>
    <div class="row2">
      <div class="field"><label>Fecha</label><input type="date" id="mFecha" value="${fecha}"></div>
      <div class="field"><label>Monto</label>
        <div class="money-input">
          <span class="prefix" id="mMontoPrefix">${(existing?.cuenta||state.movCuenta)==='dolar'?'USD':'$'}</span>
          <input type="text" inputmode="decimal" id="mMonto" placeholder="0,00">
        </div>
      </div>
    </div>
    <div class="field">
      <label>Categoría</label>
      <select id="mCategoria">
        ${cats.map(c=>`<option value="${c.id}" ${existing?.categoria_id===c.id?'selected':''}>${c.icono||''} ${esc(c.nombre)}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>Detalle (opcional — ej: nombre del comercio)</label>
      <input type="text" id="mDetalle" value="${esc(existing?.detalle||'')}" placeholder="Ej: MiniMercado, La Anónima...">
    </div>
    <div class="err" id="mErr"></div>
    <div class="modal-actions">
      ${isEdit ? `<button class="ghost" onclick="delMovimiento(${existing.id})">Eliminar</button>` : `<span></span>`}
      <div style="display:flex;gap:8px;">
        <button class="ghost" onclick="closeModal()">Cancelar</button>
        <button class="primary ${tipo==='egreso'?'egreso':''}" onclick="saveMovimiento('${tipo}', ${existing?existing.id:'null'})">Guardar</button>
      </div>
    </div>
  `);
  formatearInputMoneda(document.getElementById('mMonto'));
  setValorMoneda(document.getElementById('mMonto'), existing?.monto);
}
function editMovimiento(id){
  const m = state.movimientos.find(x=>x.id===id);
  movimientoForm(m.tipo, m);
}
async function saveMovimiento(tipo, id){
  const cuenta = document.getElementById('mCuenta').value;
  const fecha = document.getElementById('mFecha').value;
  const monto = valorMoneda(document.getElementById('mMonto'));
  const categoria_id = Number(document.getElementById('mCategoria').value);
  const detalle = document.getElementById('mDetalle').value.trim();
  const errBox = document.getElementById('mErr');
  if(!fecha || !monto || monto<=0 || !categoria_id){
    errBox.textContent = 'Completá fecha, categoría y un monto mayor a cero.';
    errBox.style.display = 'block';
    return;
  }
  const data = { cuenta, tipo, fecha, monto, categoria_id, detalle, user_id: state.user.id };
  if(id){ await sb.from('movimientos').update(data).eq('id', id); toast('Movimiento actualizado'); }
  else{ await sb.from('movimientos').insert(data); toast('Movimiento agregado'); }
  closeModal();
  await load(); render();
}
async function delMovimiento(id){
  const ok = await confirmDialog('¿Eliminar este movimiento?');
  if(!ok) return;
  await sb.from('movimientos').delete().eq('id', id);
  closeModal(); toast('Movimiento eliminado');
  await load(); render();
}

// ---------------- ESTADÍSTICAS ----------------
function renderEstadisticas(){
  const cuentaSel = state.movCuenta;
  const tabs = Object.keys(CUENTAS).map(cv=>`<button class="${cuentaSel===cv?'active':''}" onclick="setMovCuenta('${cv}')">${CUENTAS[cv].label}</button>`).join('');
  const barsHtml = renderBarrasMensuales(cuentaSel);

  const gastos = movimientosFiltrados(cuentaSel).filter(m=>m.tipo==='egreso');
  const porCat = {};
  gastos.forEach(m=>{ porCat[m.categoria_id] = (porCat[m.categoria_id]||0) + Number(m.monto); });
  const rows = Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  const max = rows.length ? rows[0][1] : 1;
  const totalGastos = rows.reduce((a,[,v])=>a+v,0) || 1;
  const hbars = rows.length ? rows.map(([cid,val])=>`
    <div class="hbar-row">
      <div>${catLabel(Number(cid))}</div>
      <div class="hbar-track"><div class="hbar-fill" style="width:${(val/max*100).toFixed(1)}%"></div></div>
      <div class="amt">${money(val)} · ${(val/totalGastos*100).toFixed(0)}%</div>
    </div>`).join('') : `<div class="empty">Sin egresos cargados en ${cuentaSel} durante ${labelPeriodo()}.</div>`;

  const anual = totales(movimientosFiltrados(cuentaSel));

  return `
    <div class="tabs">${tabs}</div>
    <div class="grid4" style="grid-template-columns:repeat(3,1fr);margin-bottom:18px;">
      <div class="stat"><div class="lbl">Ingresos · ${labelPeriodo()}</div><div class="val" style="color:var(--ingreso)">${money(anual.ing, cuentaSel)}</div></div>
      <div class="stat"><div class="lbl">Egresos · ${labelPeriodo()}</div><div class="val" style="color:var(--egreso)">${money(anual.egr, cuentaSel)}</div></div>
      <div class="stat ${anual.bal>=0?'bal-pos':'bal-neg'}"><div class="lbl">Resultado · ${labelPeriodo()}</div><div class="val">${money(anual.bal, cuentaSel)}</div></div>
    </div>
    <div class="grid2">
      <div class="card chart-card">
        <h3>Evolución mensual — ${CUENTAS[cuentaSel].label} · ${state.year===0?'todos los años':state.year}</h3>
        ${barsHtml}
      </div>
      <div class="card chart-card">
        <h3>Gastos por categoría — ${CUENTAS[cuentaSel].label} · ${labelPeriodo()}</h3>
        <div class="hbars">${hbars}</div>
      </div>
    </div>
  `;
}

// ---------------- CATEGORÍAS (admin) ----------------
function renderCategorias(){
  const ing = state.categorias.filter(c=>c.tipo==='ingreso');
  const egr = state.categorias.filter(c=>c.tipo==='egreso');
  const item = c => `
    <div class="cat-item ${c.activa===false?'inactiva':''}">
      <div class="name">${c.icono||''} ${esc(c.nombre)}</div>
      <div class="actions">
        <button onclick="categoriaForm(${c.id})">Editar</button>
        <button onclick="toggleCategoriaActiva(${c.id}, ${c.activa===false})">${c.activa===false?'Activar':'Desactivar'}</button>
      </div>
    </div>`;
  return `
    <div class="toolbar">
      <div style="font-size:13px;color:var(--ink-soft)">Estas son las opciones que ves vos y tu pareja al cargar un movimiento.</div>
      <button class="primary" onclick="categoriaForm()">+ Nueva categoría</button>
    </div>
    <div class="cat-grid">
      <div class="card"><div style="padding:12px 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);">Ingresos</div>${ing.map(item).join('') || '<div class="empty">Sin categorías</div>'}</div>
      <div class="card"><div style="padding:12px 14px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line);">Egresos</div>${egr.map(item).join('') || '<div class="empty">Sin categorías</div>'}</div>
    </div>
  `;
}
function categoriaForm(id){
  const c = id ? state.categorias.find(x=>x.id===id) : null;
  openModal(`
    <h3>${c?'Editar':'Nueva'} categoría</h3>
    <div class="row2">
      <div class="field"><label>Ícono (emoji, opcional)</label><input type="text" id="cIcono" value="${esc(c?.icono||'💰')}" maxlength="4"></div>
      <div class="field"><label>Tipo</label>
        <select id="cTipo" ${c?'disabled':''}>
          <option value="ingreso" ${c?.tipo==='ingreso'?'selected':''}>Ingreso</option>
          <option value="egreso" ${!c||c?.tipo==='egreso'?'selected':''}>Egreso</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Nombre</label><input type="text" id="cNombre" value="${esc(c?.nombre||'')}" placeholder="Ej: Supermercado"></div>
    <div class="field"><label>Orden (menor = aparece primero)</label><input type="number" id="cOrden" value="${c?.orden??10}"></div>
    <div class="err" id="cErr"></div>
    <div class="modal-actions">
      ${c ? `<button class="ghost" onclick="delCategoria(${c.id})">Eliminar</button>` : `<span></span>`}
      <div style="display:flex;gap:8px;">
        <button class="ghost" onclick="closeModal()">Cancelar</button>
        <button class="primary" onclick="saveCategoria(${c?c.id:'null'})">Guardar</button>
      </div>
    </div>
  `);
}
async function saveCategoria(id){
  const nombre = document.getElementById('cNombre').value.trim();
  const tipo = document.getElementById('cTipo').value;
  const icono = document.getElementById('cIcono').value.trim();
  const orden = Number(document.getElementById('cOrden').value)||10;
  if(!nombre){ const e=document.getElementById('cErr'); e.textContent='Poné un nombre.'; e.style.display='block'; return; }
  const data = { nombre, tipo, icono, orden };
  if(id){ await sb.from('categorias').update(data).eq('id', id); toast('Categoría actualizada'); }
  else{ await sb.from('categorias').insert(data); toast('Categoría creada'); }
  closeModal(); await load(); render();
}
async function delCategoria(id){
  const ok = await confirmDialog('¿Eliminar esta categoría? Los movimientos que la usan quedarán sin categoría.');
  if(!ok) return;
  await sb.from('categorias').delete().eq('id', id);
  closeModal(); toast('Categoría eliminada');
  await load(); render();
}
async function toggleCategoriaActiva(id, nuevoValor){
  await sb.from('categorias').update({ activa: nuevoValor }).eq('id', id);
  await load(); render();
}

// ---------------- USUARIOS (admin) ----------------
function renderUsuarios(){
  const rows = (state.allProfiles||[]).map(p=>`
    <tr>
      <td>${esc(p.nombre||'—')}</td>
      <td>${esc(p.email)}</td>
      <td><span class="tag ${p.rol==='admin'?'tag-ingreso':'tag-egreso'}">${p.rol}</span></td>
      <td class="actions">
        ${p.id!==state.user.id ? `<button onclick="toggleRol('${p.id}','${p.rol==='admin'?'user':'admin'}')">${p.rol==='admin'?'Quitar admin':'Hacer admin'}</button>` : '<span style="color:var(--ink-soft);font-size:12px;">Vos</span>'}
      </td>
    </tr>`).join('');
  return `
    <div class="hint-box">
      Para darle acceso a tu pareja: compartile el link de la página y que toque <b>"Crear cuenta"</b> con su propio email y contraseña.
      Va a entrar automáticamente con rol <b>usuario</b> y sus datos van a ser completamente independientes de los tuyos.
    </div>
    <div class="card">
      <div class="table-scroll"><table><thead><tr><th>Nombre</th><th>Email</th><th>Rol</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>
  `;
}
async function toggleRol(id, rol){
  await sb.from('profiles').update({ rol }).eq('id', id);
  toast('Rol actualizado');
  await load(); render();
}

// ---------------- Confirmación con modal (reemplaza confirm() nativo) ----------------
function confirmDialog(mensaje){
  return new Promise(resolve=>{
    openModal(`
      <h3>Confirmar</h3>
      <p style="color:var(--ink-soft);font-size:13.5px;margin:0 0 4px;">${esc(mensaje)}</p>
      <div class="modal-actions">
        <span></span>
        <div style="display:flex;gap:8px;">
          <button class="ghost" id="confNo">Cancelar</button>
          <button class="primary egreso" id="confSi">Eliminar</button>
        </div>
      </div>
    `);
    document.getElementById('confNo').onclick = ()=>{ closeModal(); resolve(false); };
    document.getElementById('confSi').onclick = ()=>{ resolve(true); };
  });
}

// ---------------- Modal helpers ----------------
function openModal(html){ document.getElementById('modalBody').innerHTML = html; document.getElementById('overlay').classList.add('show'); }
function closeModal(){ document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeModal(); });

if(SUPABASE_URL.includes('PEGAR_TU')){
  document.getElementById('content').innerHTML = `<div class="card"><div class="empty"><b>Falta configurar Supabase</b>Editá app.html e index.html con la URL y la clave de tu proyecto.</div></div>`;
} else {
  boot();
}
